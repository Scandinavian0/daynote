[workspace]
members = ["crates/core", "crates/cli", "src-tauri"]
# resolver 3 is MSRV-aware: it picks dependency versions that build on the
# toolchain declared in rust-version below (this machine has Rust 1.85).
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
daynote-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = ">=0.32, <0.43", features = ["bundled"] }
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
