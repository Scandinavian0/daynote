name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Select Rust
        run: rustup override set 1.85.0
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: cargo test --workspace --locked
      - name: Build Windows installer
        run: npm run release:build
      - name: Verify installation, desktop shortcut and uninstall
        shell: pwsh
        run: ./scripts/verify-installer.ps1 -Installer ./dist/DayNote-0.1.0-windows-x64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: daynote-windows-x64
          path: dist/*
          if-no-files-found: error
